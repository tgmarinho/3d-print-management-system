      <text x="60" y="45" fill="#746C60" font-family="Fira Sans, Arial, sans-serif" font-size="13">$1,240.00 to receive</text>
    </g>
  </g>
  <g transform="translate(112 506)">
    <rect width="138" height="52" rx="12" fill="#FFFFFF" stroke="#DED8CA"/>
    <text x="18" y="23" fill="#746C60" font-family="Fira Sans, Arial, sans-serif" font-size="13">Clients</text>
    <text x="18" y="42" fill="#322E29" font-family="Fira Code, ui-monospace, monospace" font-size="19" font-weight="700">128</text>
    <rect x="158" width="138" height="52" rx="12" fill="#FFFFFF" stroke="#DED8CA"/>
    <text x="176" y="23" fill="#746C60" font-family="Fira Sans, Arial, sans-serif" font-size="13">Filaments</text>
    <text x="176" y="42" fill="#322E29" font-family="Fira Code, ui-monospace, monospace" font-size="19" font-weight="700">42</text>
    <rect x="316" width="138" height="52" rx="12" fill="#FFFFFF" stroke="#DED8CA"/>
    <text x="334" y="23" fill="#746C60" font-family="Fira Sans, Arial, sans-serif" font-size="13">Orders</text>
    <text x="334" y="42" fill="#322E29" font-family="Fira Code, ui-monospace, monospace" font-size="19" font-weight="700">19</text>
  </g>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" stroke="#DED8CA" stroke-width="1"/>
    </pattern>
  </defs>
